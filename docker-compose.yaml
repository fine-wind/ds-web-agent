services:
  agent-executor:
    image: python:3.13-alpine3.23
    container_name: agent-executor
    working_dir: /app
    ports:
      - "8765:8765"
    volumes:
      - ./:/app
      - ./work/:/work
    environment:
      AGENT_WS_HOST: 0.0.0.0
      AGENT_WS_PORT: "8765"
      AGENT_WORK_DIR: /work
      PYTHONUNBUFFERED: "1"
      AGENT_LLAMA_HOST: "http://192.168.1.46:9931"
    command: >
      sh -c "pip install --no-cache-dir requests websockets &&
             python /app/agent_executor.py"
    restart: unless-stopped
    tty: true
    stdin_open: true